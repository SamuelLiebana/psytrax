<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">psytrax modelling pipeline</title>
  <desc id="desc">Trial-aligned behavioural data and a model likelihood enter psytrax, which returns parameter trajectories, uncertainty, and model evidence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfc"/>
      <stop offset="1" stop-color="#edf4f3"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#195f78"/>
      <stop offset="1" stop-color="#2f7d67"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17313b" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2d5362"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="1104" height="454" rx="28" fill="url(#background)" stroke="#d7e4e5" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="58" y="78" width="218" height="244" rx="20" fill="#ffffff"/>
    <rect x="330" y="78" width="218" height="244" rx="20" fill="#ffffff"/>
    <rect x="622" y="94" width="188" height="212" rx="28" fill="url(#core)"/>
    <rect x="858" y="78" width="218" height="244" rx="20" fill="#ffffff"/>
  </g>

  <text x="167" y="122" text-anchor="middle" fill="#17313b" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Trial data</text>
  <text x="167" y="154" text-anchor="middle" fill="#5c7078" font-family="Inter, Arial, sans-serif" font-size="16">one row per trial</text>
  <g transform="translate(92 182)">
    <rect x="0" y="0" width="150" height="96" rx="10" fill="#f2f7f8" stroke="#d8e6e9"/>
    <line x1="0" y1="32" x2="150" y2="32" stroke="#d8e6e9"/>
    <line x1="50" y1="0" x2="50" y2="96" stroke="#d8e6e9"/>
    <line x1="100" y1="0" x2="100" y2="96" stroke="#d8e6e9"/>
    <text x="25" y="22" text-anchor="middle" fill="#195f78" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">c</text>
    <text x="75" y="22" text-anchor="middle" fill="#195f78" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">r</text>
    <text x="125" y="22" text-anchor="middle" fill="#195f78" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">rt</text>
    <circle cx="25" cy="52" r="5" fill="#2f7d67"/>
    <circle cx="75" cy="52" r="5" fill="#d48a2f"/>
    <circle cx="125" cy="52" r="5" fill="#195f78"/>
    <circle cx="25" cy="76" r="5" fill="#d48a2f"/>
    <circle cx="75" cy="76" r="5" fill="#195f78"/>
    <circle cx="125" cy="76" r="5" fill="#2f7d67"/>
  </g>

  <text x="439" y="122" text-anchor="middle" fill="#17313b" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Model</text>
  <text x="439" y="154" text-anchor="middle" fill="#5c7078" font-family="Inter, Arial, sans-serif" font-size="16">built-in or custom</text>
  <g transform="translate(362 183)">
    <rect x="0" y="0" width="154" height="94" rx="12" fill="#f2f7f8" stroke="#d8e6e9"/>
    <text x="77" y="38" text-anchor="middle" fill="#195f78" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="700">log p(yₜ|xₜ, θₜ)</text>
    <text x="77" y="68" text-anchor="middle" fill="#5c7078" font-family="Inter, Arial, sans-serif" font-size="14">JAX likelihood</text>
  </g>

  <text x="716" y="151" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">psytrax</text>
  <text x="716" y="188" text-anchor="middle" fill="#dff1ef" font-family="Inter, Arial, sans-serif" font-size="16">Empirical Bayes</text>
  <text x="716" y="214" text-anchor="middle" fill="#dff1ef" font-family="Inter, Arial, sans-serif" font-size="16">random-walk prior</text>
  <text x="716" y="240" text-anchor="middle" fill="#dff1ef" font-family="Inter, Arial, sans-serif" font-size="16">Laplace evidence</text>

  <text x="967" y="122" text-anchor="middle" fill="#17313b" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Results</text>
  <text x="967" y="154" text-anchor="middle" fill="#5c7078" font-family="Inter, Arial, sans-serif" font-size="16">trajectories + evidence</text>
  <g transform="translate(892 182)">
    <rect x="0" y="0" width="150" height="96" rx="10" fill="#f2f7f8" stroke="#d8e6e9"/>
    <path d="M12 66 C30 35 48 38 66 50 S102 74 136 20" fill="none" stroke="#195f78" stroke-width="5" stroke-linecap="round"/>
    <path d="M12 76 C30 48 48 50 66 61 S102 84 136 41" fill="none" stroke="#d48a2f" stroke-width="4" stroke-linecap="round"/>
    <path d="M18 22 H66" stroke="#d8e6e9" stroke-width="5" stroke-linecap="round"/>
    <path d="M18 38 H46" stroke="#d8e6e9" stroke-width="5" stroke-linecap="round"/>
  </g>

  <line x1="278" y1="200" x2="316" y2="200" stroke="#2d5362" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="550" y1="200" x2="606" y2="200" stroke="#2d5362" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="812" y1="200" x2="844" y2="200" stroke="#2d5362" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(106 374)">
    <text x="0" y="0" fill="#5c7078" font-family="Inter, Arial, sans-serif" font-size="17">Inputs stay simple: arrays, dictionaries, and one likelihood function.</text>
    <text x="0" y="34" fill="#5c7078" font-family="Inter, Arial, sans-serif" font-size="17">Outputs stay scientific: trajectories, credible intervals, and model evidence.</text>
  </g>
</svg>
