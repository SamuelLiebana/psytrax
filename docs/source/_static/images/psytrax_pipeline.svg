<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">psytrax modelling pipeline</title>
  <desc id="desc">Trial-aligned behavioural data with inputs x, outputs y, and time t, plus a model likelihood, enter psytrax. psytrax combines random-walk priors, optional learning rules, Empirical Bayes, and Laplace evidence to return trajectories, uncertainty, and model evidence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfc"/>
      <stop offset="1" stop-color="#edf4f3"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#195f78"/>
      <stop offset="1" stop-color="#2f7d67"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17313b" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2d5362"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="1104" height="484" rx="28" fill="url(#background)" stroke="#d7e4e5" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="58" y="78" width="228" height="272" rx="20" fill="#ffffff"/>
    <rect x="328" y="78" width="228" height="272" rx="20" fill="#ffffff"/>
    <rect x="610" y="66" width="232" height="296" rx="28" fill="url(#core)"/>
    <rect x="878" y="78" width="198" height="272" rx="20" fill="#ffffff"/>
  </g>

  <text x="172" y="122" text-anchor="middle" fill="#17313b" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Trial data</text>
  <text x="172" y="154" text-anchor="middle" fill="#5c7078" font-family="Inter, Arial, sans-serif" font-size="16">one aligned row per trial</text>
  <g transform="translate(84 186)">
    <rect x="0" y="0" width="176" height="118" rx="10" fill="#f2f7f8" stroke="#d8e6e9"/>
    <line x1="0" y1="42" x2="176" y2="42" stroke="#d8e6e9"/>
    <line x1="58.6" y1="0" x2="58.6" y2="118" stroke="#d8e6e9"/>
    <line x1="117.3" y1="0" x2="117.3" y2="118" stroke="#d8e6e9"/>
    <text x="29" y="19" text-anchor="middle" fill="#195f78" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">xₜ</text>
    <text x="88" y="19" text-anchor="middle" fill="#195f78" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">yₜ</text>
    <text x="146" y="19" text-anchor="middle" fill="#195f78" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">t</text>
    <text x="29" y="34" text-anchor="middle" fill="#5c7078" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700">inputs</text>
    <text x="88" y="34" text-anchor="middle" fill="#5c7078" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700">outputs</text>
    <text x="146" y="34" text-anchor="middle" fill="#5c7078" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700">time</text>
    <circle cx="29" cy="62" r="5" fill="#2f7d67"/>
    <circle cx="88" cy="62" r="5" fill="#d48a2f"/>
    <text x="146" y="67" text-anchor="middle" fill="#195f78" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">1</text>
    <circle cx="29" cy="88" r="5" fill="#d48a2f"/>
    <circle cx="88" cy="88" r="5" fill="#195f78"/>
    <text x="146" y="93" text-anchor="middle" fill="#195f78" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">2</text>
    <circle cx="29" cy="106" r="4" fill="#195f78" opacity="0.6"/>
    <circle cx="88" cy="106" r="4" fill="#2f7d67" opacity="0.6"/>
    <text x="146" y="111" text-anchor="middle" fill="#5c7078" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">...</text>
  </g>

  <text x="442" y="122" text-anchor="middle" fill="#17313b" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Model</text>
  <text x="442" y="154" text-anchor="middle" fill="#5c7078" font-family="Inter, Arial, sans-serif" font-size="16">built-in or custom</text>
  <g transform="translate(346 190)">
    <rect x="0" y="0" width="192" height="104" rx="12" fill="#f2f7f8" stroke="#d8e6e9"/>
    <text x="96" y="38" text-anchor="middle" fill="#195f78" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700">log p(yₜ | xₜ, θₜ)</text>
    <text x="96" y="68" text-anchor="middle" fill="#5c7078" font-family="Inter, Arial, sans-serif" font-size="14">JAX likelihood</text>
    <text x="96" y="89" text-anchor="middle" fill="#5c7078" font-family="Inter, Arial, sans-serif" font-size="12">plus model hyperparameters</text>
  </g>

  <g transform="translate(647 99)">
    <rect x="0" y="0" width="46" height="45" rx="12" fill="#ffffff" opacity="0.16"/>
    <path d="M9 35 H39 M11 36 V10" fill="none" stroke="#dff1ef" stroke-width="2.2" stroke-linecap="round" opacity="0.78"/>
    <path d="M13 30 C21 29 30 29 40 28" fill="none" stroke="#f1b65e" stroke-width="3" stroke-linecap="round"/>
    <path d="M13 25 C23 24 29 20 40 14" fill="none" stroke="#bfeee1" stroke-width="3" stroke-linecap="round"/>
    <path d="M13 32 C25 32 29 12 40 10" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="13" cy="32" r="2.3" fill="#ffffff"/>
    <circle cx="40" cy="10" r="2.3" fill="#f1b65e"/>
    <text x="58" y="33" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="0">psytrax</text>
  </g>
  <g transform="translate(639 167)">
    <rect x="0" y="0" width="174" height="31" rx="8" fill="#ffffff" opacity="0.13"/>
    <rect x="0" y="39" width="174" height="31" rx="8" fill="#ffffff" opacity="0.13"/>
    <rect x="0" y="78" width="174" height="31" rx="8" fill="#ffffff" opacity="0.13"/>
    <rect x="0" y="117" width="174" height="31" rx="8" fill="#ffffff" opacity="0.13"/>
    <text x="87" y="21" text-anchor="middle" fill="#dff1ef" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">random-walk prior</text>
    <text x="87" y="60" text-anchor="middle" fill="#dff1ef" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">learning-rule updates</text>
    <text x="87" y="99" text-anchor="middle" fill="#dff1ef" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Empirical Bayes</text>
    <text x="87" y="138" text-anchor="middle" fill="#dff1ef" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Laplace evidence</text>
  </g>

  <text x="977" y="122" text-anchor="middle" fill="#17313b" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Results</text>
  <text x="977" y="154" text-anchor="middle" fill="#5c7078" font-family="Inter, Arial, sans-serif" font-size="16">trajectories + evidence</text>
  <g transform="translate(904 190)">
    <rect x="0" y="0" width="146" height="104" rx="10" fill="#f2f7f8" stroke="#d8e6e9"/>
    <path d="M12 68 C29 36 48 40 65 52 S101 78 132 22" fill="none" stroke="#195f78" stroke-width="5" stroke-linecap="round"/>
    <path d="M12 80 C29 51 48 54 65 63 S101 86 132 45" fill="none" stroke="#d48a2f" stroke-width="4" stroke-linecap="round"/>
    <path d="M18 24 H67" stroke="#d8e6e9" stroke-width="5" stroke-linecap="round"/>
    <path d="M18 40 H49" stroke="#d8e6e9" stroke-width="5" stroke-linecap="round"/>
    <circle cx="132" cy="22" r="4" fill="#195f78"/>
    <circle cx="132" cy="45" r="4" fill="#d48a2f"/>
  </g>

  <line x1="288" y1="216" x2="316" y2="216" stroke="#2d5362" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="558" y1="216" x2="594" y2="216" stroke="#2d5362" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="844" y1="216" x2="864" y2="216" stroke="#2d5362" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(102 412)">
    <text x="0" y="0" fill="#5c7078" font-family="Inter, Arial, sans-serif" font-size="17">Data stay trial-aligned: xₜ inputs, yₜ outputs, time t, and optional covariates such as rewards.</text>
    <text x="0" y="34" fill="#5c7078" font-family="Inter, Arial, sans-serif" font-size="17">Outputs stay scientific: trajectories, credible intervals, learning-rate estimates, and model evidence.</text>
  </g>
</svg>
