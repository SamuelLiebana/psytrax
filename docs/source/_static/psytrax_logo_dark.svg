<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 96" role="img" aria-labelledby="title desc">
  <title id="title">psytrax logo</title>
  <desc id="desc">A trajectory mark beside the psytrax wordmark.</desc>
  <defs>
    <linearGradient id="mark" x1="10" y1="12" x2="88" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4aa1bd"/>
      <stop offset="1" stop-color="#6bd4b0"/>
    </linearGradient>
  </defs>
  <g fill="none" fill-rule="evenodd">
    <rect x="10" y="12" width="74" height="72" rx="18" fill="url(#mark)"/>
    <path d="M24 65 C34 48 42 50 50 56 S66 67 72 34" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M25 28 H71" stroke="#e8fbf6" stroke-width="4" stroke-linecap="round" opacity="0.78"/>
    <path d="M28 40 H47" stroke="#e8fbf6" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
    <circle cx="24" cy="65" r="5" fill="#f1b65e"/>
    <circle cx="50" cy="56" r="5" fill="#ffffff"/>
    <circle cx="72" cy="34" r="5" fill="#f1b65e"/>
    <text x="102" y="62" fill="#f2f7f8" font-family="Inter, Arial, sans-serif" font-size="45" font-weight="800" letter-spacing="0">psy<tspan fill="#6bd4b0">trax</tspan></text>
  </g>
</svg>
