[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psytrax"
version = "0.1.0"
description = "Empirical Bayes fitting for trial-by-trial decision models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax[cpu]>=0.6",
    "optax>=0.2.3",
    "numpy>=1.23",
    "scipy>=1.12",
    "tqdm>=4.60",
]

[project.optional-dependencies]
web = [
    "matplotlib>=3.7",
    "pandas>=1.5",
    "streamlit>=1.30",
]
ibl = [
    "ONE-api>=2.0",
]
dev = [
    "matplotlib>=3.7",
    "pandas>=1.5",
    "pytest>=8",
    "streamlit>=1.30",
    "ONE-api>=2.0",
]
docs = [
    "myst-parser>=4",
    "numpydoc>=1.8",
    "pydata-sphinx-theme>=0.16",
    "sphinx>=8",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
]

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]
